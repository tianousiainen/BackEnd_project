<!DOCTYPE html>
    <html lang="en"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Discipline list</title>
        <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    </head>
    <body>
        <h1>Discipline list</h1>

        
      <table class="table table-striped">
            <tr>
                <th>Dicipline</th>
                <th> </th>
                <th> </th>
            </tr>

            <tr th:each="dicipline : ${diciplines}">
                <td th:text="${dicipline.dicipline}"></td>

                <td  sec:authorize="hasAuthority('ADMIN')"><a class="btn btn-danger" 
                    th:href="@{/deletedicipline/{id}(id=${dicipline.diciplineid})}">Delete</a></td>
                <td><a class="btn btn-secondary" 
                    th:href="@{/editdicipline/{id}(id=${dicipline.diciplineid})}">Edit</a></td>
            </tr>
      </table>
        <p><a class="btn btn-success" th:href="@{/addDicipline}">Add dicipline</a></p>
       <p><a class="btn btz-xs btn-secondary" th:href="@{/studentlist}">Back to students</a></p>
    </body>
</html>
