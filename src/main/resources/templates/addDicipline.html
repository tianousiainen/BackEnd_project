<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add dicipline</title>
</head>
<body>
    <h1>Add Dicipline</h1>
    
    <form method="post" action="#" th:action="@{/savedicipline}" th:object="${newDicipline}">
        <p>Dicipline: <input type="text" th:field="*{dicipline}"></p>
        <input type="submit" value="Submit"> <input type="reset" value="Reset">
    </form>
</body>
</html>
