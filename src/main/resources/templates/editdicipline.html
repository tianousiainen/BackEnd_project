<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit dicipline</title>
</head>
<body>
    <h1>Edit dicipline</h1>

    <form method="post" action="#" th:action="@{/savedicipline}" th:object="${dicipline}">
        <input type="hidden" th:field="*{diciplineid}">
         <p>Dicipline
            <select th:field="*{dicipline}">
                <option th:each="d : ${diciplines}"
                    th:value="${d.dicipline}"
                    th:text="${d.dicipline}"
                ></option>
            </select>
        </p>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
