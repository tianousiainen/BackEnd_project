<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student list</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>
    <h1>Student list</h1>

    <div class="d-flex justify-content-between aling-items-center me-4">
        <h1>Welcome</h1>

        <form th:action="@{logout}" method="post">
            <input type="submit" value="Sign out" class="btn btn-sm btn-danger">
        </form>
    </div>  

    <table class="table table-striped">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Address</th>
            <th>Email</th>
            <th>Status</th>
            <th>Group</th>
            <th> </th>
            <th> </th>
        </tr>

        <tr th:each="student : ${students}">
            <td th:text="${student.name}">Name</td>
            <td th:text="${student.age}">Age</td>
            <td th:text="${student.address}">Address</td>
            <td th:text="${student.email}">Email</td>
            <td th:text="${student.status}">Status</td>

            <td>
                <span th:each="group : ${student.groups}"
                    th:text="${group.name}">

                </span>
            </td>

            <td>Delete</td>

            <td>Edit</td>

        </tr>
    </table>
    <p><a class="btn btn-success" th:href="@{/addstudent}">Add student</a></p>
    <p><a class="btn btz-xs btn-secondary" th:href="@{/grouplist}">See groups</a></p>
</body>
</html>
