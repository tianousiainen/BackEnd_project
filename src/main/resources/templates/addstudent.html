<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add student</title>
</head>
<body>
    <h1>Add student</h1>

    <form method="post" action="#" th:action="@{/savestudent}" th:object= "${student}">
        <p>Name: <input type="text" th:field="${student.name}"></p>
        <p>Age: <input type="text" th:field="${student.age}"></p>
        <p>Address: <input type="text" th:field="${student.address}"></p>
        <p>Email: <input type="text" th:field="${student.email}"></p>
        <p>Status: <input type="text" th:field="${student.status}"></p>


       <p>Group</p>
       <div th:each="g : ${groups}">
            <label>
                <input type="checkbox"
                name="groupIds"
                th:value="${g.groupid}">
                <span th:text="${g.name}"></span>
            </label>

       </div>
        <br>
        <label for="deplist">Discipline</label>
        <select id="deplist" th:field="*{dicipline}" class="form-control">
            <option th:each="dicipline: ${diciplines}"
                th:value="${dicipline.diciplineid}"
                th:text="${dicipline.dicipline}"></option>
        </select>

        <div>
            <br>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>
    </form>
</body>
</html>
