<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add student</title>
</head>
<body>
    <h1>Add student</h1>

    <form method="post" action="#" th:action="@{/savebook}" th:object= "${student}">
        <p>Name: <input type="text" th:field="${student.name}"></p>
        <p>Age: <input type="text" th:field="${student.age}"></p>
    </form>
</body>
</html>
