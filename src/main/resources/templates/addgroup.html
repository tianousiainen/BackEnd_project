<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add group</title>
</head>
<body>
    <h1>Add group</h1>

    <form method="post" action="#" th:action="@{/savegroup}" th:object="${group}">
        <p>Group: <input type="text" th:field="${group.name}"></p>
        <input type="submit" value="Submit"> <input type="reset" value="Reset">
    </form>
</body>
</html>
